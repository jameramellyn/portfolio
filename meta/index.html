<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <h1>Meta</h1>

  <div class="slider-container">
    <label>
      Show commits until:
      <input
        type="range"
        id="commit-progress"
        min="0"
        max="100"
        value="100"
      />
      <time id="commit-progress-time"></time>
    </label>
  </div>

  <div id="stats"></div>

  <h2>Commits by time of day</h2>

  <div id="chart"></div>

  <p id="selection-count">No commits selected</p>
  <dl id="language-breakdown"></dl>

  <dl id="commit-tooltip" class="tooltip" hidden>
    <dt>Commit</dt>
    <dd><a id="commit-link" href="#" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines</dt>
    <dd id="commit-lines"></dd>
  </dl>

  <script type="module" src="./main.js"></script>
</body>
</html>
